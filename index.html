<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fecha y Hora</title>
<style>
    html, body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
        font-family: "Times New Roman", Georgia, serif;
    }

    /* The label fills the whole frame: frame limits = label limits */
    #lbl {
        box-sizing: border-box;
        width: 100%;
        height: 100%;
        border: 1px solid #5B1E2E;
        color: #5B1E2E;
        background: transparent;
        padding: 0 8px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        line-height: 1.2;
        overflow: hidden;
        white-space: nowrap;
    }

    /* Sizes follow the frame height, so it can be resized in Notion */
    #dayDate {
        font-size: clamp(13px, 4vw, 16px);
        text-transform: capitalize;
    }

    #time {
        font-size: clamp(18px, 9vw, 40px);
        margin: 2px 0;
        letter-spacing: 1px;
    }

    #greeting {
        font-size: clamp(12px,3.4vw, 14px);
    }
</style>
</head>
<body>
    <div id="lbl">
        <div id="dayDate"></div>
        <div id="time"></div>
        <div id="greeting"></div>
    </div>

<script>
    var dias = [
        "Sunday", "Monday", "Tuesday", "Wednesday",
        "Thursday", "Friday", "Saturday"
    ];

    var meses = [
        "January", "February", "March", "April",
        "May", "June", "July", "August",
        "September", "October", "November", "December"
    ];

    function actualizar() {
        var ahora = new Date();

        var diaSemana = dias[ahora.getDay()];
        var dia = ahora.getDate();
        var mes = meses[ahora.getMonth()];
        var anio = ahora.getFullYear();

        document.getElementById('dayDate').textContent =
            diaSemana + ", " + mes + " " + dia + ", " + anio;

        var horas = ahora.getHours();
        var minutos = ahora.getMinutes();
        var ampm = horas >= 12 ? "PM" : "AM";

        var horas12 = horas % 12;
        horas12 = horas12 ? horas12 : 12;
        minutos = minutos < 10 ? "0" + minutos : minutos;

        document.getElementById('time').textContent =
            horas12 + ":" + minutos + " " + ampm;

        var saludo;

        if (horas < 12) {
            saludo = "Good Morning 𖹭";
        } else if (horas < 18) {
            saludo = "Good Afternoon 𖹭";
        } else {
            saludo = "Good Evening 𖹭";
        }

        document.getElementById('greeting').textContent = saludo;
    }

    actualizar();
    setInterval(actualizar, 1000);
</script>
</body>
</html>
